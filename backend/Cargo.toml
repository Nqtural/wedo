[package]
name = "wedo-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9" }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
http = "1.5.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["chrono", "runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
